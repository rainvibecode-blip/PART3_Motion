<!-- 씬 "tp": 도형 와이프가 있는 TIP #n 타이틀 카드(약 0.9초 후 고정).
     프레임 0~8은 삼각형 와이프다(흰 노치가 있는 검정 쐐기 → 더 큰 노치 →
     흰 바탕에 검정 톱니 → 흰 모서리가 남은 검정). 이어 원근으로 기울어진
     아웃라인 제목이 제자리에 꽂히고, 파랑 스트로크와 테두리가 번쩍인 뒤,
     실제 제목이 자리 잡고 TIP #n이 페이드인한다.
     첫 프레임들은 일부가 투명하다. 이 호스트를 앞 씬이 끝나기 약 0.2초 전에,
     앞 씬보다 위에 올려 두면 쐐기가 나가는 화면 위를 자른다. -->
<template>
  <style>

    #tp-ground { opacity: 0; }
    #tp-lock { top: 380px; }
    #tp-ghostwrap { position: absolute; left: 0; right: 0; top: 448px; text-align: center; }
    #tp-para {
      position: absolute; left: 50%; top: 452px; width: 980px; height: 132px; margin-left: -490px;

  <div id="root" data-composition-id="tp" data-width="1920" data-height="1080">

    </div>
  </div>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var F = UIX.F;
      var on = function (sel, f) { tl.set(sel, { opacity: 1 }, f * F); };
      var off = function (sel, f) { tl.set(sel, { opacity: 0 }, f * F); };

      // F0-2: 검정 쐐기, 작은 흰 노치 (모서리로 나가는 화면이 보임)
      on(["#tp-a", "#tp-notch"], 0);
      tl.set("#tp-notch", { attr: { points: "900,0 1020,0 960,80" } }, 0);
      // F3-5: 전체 검정, 더 큰 노치
      on("#tp-black", 3); off("#tp-a", 3);
      tl.set("#tp-notch", { attr: { points: "760,0 1160,0 960,330" } }, 3 * F);
      // F6-8: 흰 바탕, 아래에서 검정 톱니가 솟음
      off(["#tp-black", "#tp-notch"], 6); on(["#tp-white", "#tp-t1", "#tp-t2", "#tp-t3"], 6);
      // F9~: 검정 바탕, 흰 모서리가 줄어들며 사라짐
      off(["#tp-white", "#tp-t1", "#tp-t2", "#tp-t3"], 9); on(["#tp-ground", "#tp-c1", "#tp-c2"], 9);
      tl.fromTo("#tp-c1", { attr: { points: "0,0 620,0 0,460" } }, { attr: { points: "0,0 0,0 0,0" }, duration: 5 * F, ease: "power2.in", immediateRender: false }, 9 * F);
      tl.fromTo("#tp-c2", { attr: { points: "1920,0 1300,0 1920,460" } }, { attr: { points: "1920,0 1920,0 1920,0" }, duration: 5 * F, ease: "power2.in", immediateRender: false }, 9 * F);

      // 아웃라인 제목이 기울어진 원근에서 날아와 꽂힘
      tl.fromTo("#tp-ghost",
        { opacity: 1, x: 420, y: -40, scale: 1.45, rotationY: -38, rotationZ: -9, skewX: -12, transformPerspective: 900 },
        { x: 0, y: 0, scale: 1, rotationY: 0, rotationZ: 0, skewX: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, 9 * F);
      UIX.draw(tl, "#tp-streak-p", 11 * F, { dur: 4 * F, ease: "power2.out" });
      off("#tp-streak", 16);
      on("#tp-para", 16); off("#tp-para", 18);

      // 실제 제목이 자리 잡고, 아웃라인 복사본은 사라짐
      off("#tp-ghost", 18);
      tl.set("#tp-title", { opacity: 1 }, 18 * F);
      UIX.fade(tl, "#tp-sub", 18 * F, { dur: 0.15 });
      UIX.blurIn(tl, "#tp-eye", 0.9, { y: 8 });

      window.__timelines["tp"] = tl;
    })();

</template>
