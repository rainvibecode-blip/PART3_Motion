    (function () {
      var tl = gsap.timeline({ paused: true });

      // 대화 쪽으로 느린 푸시 인 (0초에는 창과 PiP가 제자리)
      UIX.pushIn(tl, "#sc-cam", 0.3, { scale: 1.06, origin: "62% 60%", dur: 2.0 });

      // 선택된 사이드바 행 둘레에 앰버 박스가 왼쪽 → 오른쪽으로 그려짐

      UIX.fadeOut(tl, "#sc-hbox", 2.2);

      // 스포트라이트: 화면 어둡게·흐리게, 발췌 카드 착지, 형광펜

      UIX.marker(tl, "#sc-focus .uix-mark", 2.95, { dur: 0.4, stagger: 0.45 });
      UIX.spotlightOut(tl, "#sc-dim", "#sc-focus", 5.95);

      // 커서가 전송 버튼으로 미끄러져 가서 클릭
      UIX.fade(tl, "#sc-cursor", 6.2, { dur: 0.15 });
      tl.fromTo("#sc-cursor", { x: 0, y: 0 }, { x: 223, y: 277, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 6.25);
      UIX.ripple(tl, "#sc-ripple", 6.9);
      UIX.fadeOut(tl, "#sc-cursor", 7.25, { dur: 0.15 });

      // 답변에 리더 라인 주석
      UIX.callout(tl, "#sc-dot", "#sc-lead", "#sc-callbox", 7.2);
      UIX.blurOut(tl, ["#sc-dot", "#sc-callbox"], 9.05);
      UIX.fadeOut(tl, "#sc-lead", 9.05, { dur: 0.15 });

      // 태그: 박스가 가운데서 열리고, 글자가 타이핑되고, 접혀 사라짐
      UIX.tagIn(tl, "#sc-tagbox", "#sc-tagtext", 7.35);
      UIX.tagOut(tl, "#sc-tagbox", "#sc-tagtext", 8.95);

      // 키캡
      UIX.pop(tl, "#sc-keys", 9.2, { from: 0.8, stagger: 0 });
      UIX.blurOut(tl, "#sc-keys", 9.95);

      // 기다리는 구간은 빨리감기
      UIX.fastForward(tl, "#sc-ff", "#sc-win", 10.1, 1.2);

      // 2프레임 글리치로 퇴장
      UIX.glitch(tl, "#sc-ground", 11.33, { frames: 2, bars: "#sc-glitch" });

      window.__timelines["sc"] = tl;
    })();
